name: eduflow
description: "AI-powered skill learning and productivity app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  smooth_page_indicator: ^1.1.0
  flutter_svg: ^2.0.9
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.2

  http: ^1.6.0
  file_picker: ^8.0.0
  syncfusion_flutter_pdf: ^24.2.9
  cunning_document_scanner: ^1.4.0

  # 🔥 Voice + AI
  speech_to_text: ^7.3.0
  permission_handler: ^12.0.1
  google_generative_ai: ^0.4.7
  flutter_tts: ^4.2.5

  # 🔥 PDF + File
  pdf: ^3.12.0
  path_provider: ^2.1.5
  share_plus: ^12.0.2

  # 🔥 REMINDER SYSTEM (NEW - CRITICAL)
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/focus_bg.jpg